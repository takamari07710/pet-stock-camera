<!DOCTYPE html>

<html>
<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1">

  <title>端数入力</title>

  <style>

    body {

      font-family: sans-serif;

      margin: 0;

      padding: 15px;

      background: #f5f5f5;

      color: #222;

      text-align: center;

    }


    /* =================================================
       タイトル
    ================================================= */

    h1 {

      font-size: 24px;

      margin: 10px 0 20px;

    }


    /* =================================================
       入力エリア
    ================================================= */

    .container {

      width: 100%;

      max-width: 500px;

      box-sizing: border-box;

      margin: auto;

      padding: 20px;

      background: white;

      border-radius: 10px;

    }


    /* =================================================
       ラベル
    ================================================= */

    .label {

      display: block;

      text-align: left;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    /* =================================================
       商品選択
    ================================================= */

    #productSelect {

      width: 100%;

      padding: 14px;

      font-size: 18px;

      border: 2px solid #2196f3;

      border-radius: 8px;

      background: white;

      box-sizing: border-box;

    }


    /* =================================================
       商品情報
    ================================================= */

    #productInfo {

      margin-top: 20px;

      padding: 15px;

      background: #f1f8ff;

      border-radius: 10px;

      text-align: left;

    }


    .infoRow {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 10px 0;

      border-bottom: 1px solid #ddd;

      font-size: 17px;

    }


    .infoRow:last-child {

      border-bottom: none;

    }


    .infoValue {

      font-size: 22px;

      font-weight: bold;

    }


    /* =================================================
       端数
    ================================================= */

    .remainderArea {

      margin-top: 20px;

      padding: 20px 15px;

      background: #fff8e1;

      border-radius: 10px;

    }


    #remainderInput {

      width: 150px;

      padding: 12px;

      font-size: 28px;

      text-align: center;

      border: 2px solid #ff9800;

      border-radius: 8px;

      box-sizing: border-box;

    }


    .unit {

      font-size: 20px;

      margin-left: 5px;

    }


    /* =================================================
       確定ボタン
    ================================================= */

    #confirmButton {

      display: block;

      width: 100%;

      margin-top: 20px;

      padding: 16px;

      font-size: 21px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #4caf50;

      color: white;

      cursor: pointer;

    }


    #confirmButton:disabled {

      background: #aaa;

      color: #eee;

      cursor: not-allowed;

    }


    /* =================================================
       戻るボタン
    ================================================= */

    #backButton {

      display: block;

      width: 100%;

      max-width: 500px;

      margin: 15px auto;

      padding: 15px;

      font-size: 20px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #607d8b;

      color: white;

      cursor: pointer;

    }


    /* =================================================
       メッセージ
    ================================================= */

    #message {

      width: 100%;

      max-width: 500px;

      box-sizing: border-box;

      margin: 15px auto;

      padding: 15px;

      border-radius: 10px;

      background: #e8f5e9;

    }


    #message.error {

      background: #ffebee;

      color: #c62828;

    }


    /* =================================================
       スマホ
    ================================================= */

    @media (max-width: 430px) {

      body {

        padding: 10px;

      }


      h1 {

        font-size: 22px;

      }


      #productSelect {

        font-size: 16px;

      }


      .infoRow {

        font-size: 16px;

      }

    }

  </style>

</head>

<body>

<h1>✏️ 端数入力</h1>

<div class="container">

  <!-- =================================================
       商品選択
  ================================================= -->

<label
 class="label"
 for="productSelect">


商品名


  </label>

<select
 id="productSelect">

<option value="">

  商品を読み込んでいます…

</option>


  </select>

  <!-- =================================================
       商品情報
  ================================================= -->

  <div
    id="productInfo"
    style="display:none;">


<!-- JAN -->

<div class="infoRow">

  <span>

    JAN

  </span>

  <span
    class="infoValue"
    id="jan">

    -

  </span>

</div>


<!-- 現在の端数 -->

<div class="infoRow">

  <span>

    現在の端数

  </span>

  <span
    class="infoValue"
    id="currentRemainder">

    -

  </span>

</div>


  </div>

  <!-- =================================================
       端数入力
  ================================================= -->

  <div
    class="remainderArea"
    id="remainderArea"
    style="display:none;">


<div class="label">

  追加する端数

</div>


<input
  type="number"
  id="remainderInput"
  min="0"
  step="1"
  inputmode="numeric"
  autocomplete="off"
  value="0">


<span class="unit">

  個

</span>


<!-- =================================================
     確定
================================================= -->

<button
  id="confirmButton"
  type="button"
  onclick="confirmRemainder()">

  ✓ 端数を確定

</button>


  </div>

</div>

<!-- =================================================
     メッセージ
================================================= -->

<div id="message">

商品一覧を読み込んでいます…

</div>

<!-- =================================================
     戻る
================================================= -->

<button
id="backButton"
type="button"
onclick="location.href='camera.html'">

📷 カメラに戻る

</button>

<script>


/* =================================================
   GAS URL
================================================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPr4A/exec';


/* =================================================
   変数
================================================= */

let products = [];

let selectedProduct = null;

let processing = false;


/* =================================================
   メッセージ
================================================= */

function showMessage(
  text,
  error = false
) {

  const message =
    document.getElementById(
      'message'
    );


  message.textContent =
    text;


  message.className =
    error
      ? 'error'
      : '';

}


/* =================================================
   GAS通信
================================================= */

function sendToGAS(
  action,
  jan,
  extraParams = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finished = false;


      /* ---------------------------------------------
         GAS返答
      --------------------------------------------- */

      window[callbackName] =
        function(result) {

          if (finished) {

            return;

          }


          finished = true;


          console.log(
            'GAS返答:',
            result
          );


          delete window[
            callbackName
          ];


          script.remove();


          resolve(result);

        };


      /* ---------------------------------------------
         通信エラー
      --------------------------------------------- */

      script.onerror =
        function() {

          if (finished) {

            return;

          }


          finished = true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'GASとの通信に失敗しました'
            )
          );

        };


      /* ---------------------------------------------
         URL
      --------------------------------------------- */

      let url =
        GAS_URL +
        '?action=' +
        encodeURIComponent(
          action
        ) +
        '&code=' +
        encodeURIComponent(
          jan || ''
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      /* ---------------------------------------------
         追加パラメータ
      --------------------------------------------- */

      for (
        const key in extraParams
      ) {

        url +=
          '&' +
          encodeURIComponent(key) +
          '=' +
          encodeURIComponent(
            extraParams[key]
          );

      }


      console.log(
        'GAS送信:',
        url
      );


      script.src =
        url;


      document
        .body
        .appendChild(
          script
        );

    }
  );

}


/* =================================================
   商品一覧取得
================================================= */

async function loadProducts() {

  try {

    showMessage(
      '商品一覧を読み込んでいます…'
    );


    const result =
      await sendToGAS(
        'getStockList',
        ''
      );


    console.log(
      '商品一覧:',
      result
    );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '商品一覧を取得できませんでした'
      );

    }


    products =
      result.products ||
      result.data ||
      [];


    const select =
      document.getElementById(
        'productSelect'
      );


    /* ---------------------------------------------
       初期化
    --------------------------------------------- */

    select.innerHTML =
      '';


    /* ---------------------------------------------
       初期項目
    --------------------------------------------- */

    const firstOption =
      document.createElement(
        'option'
      );


    firstOption.value =
      '';


    firstOption.textContent =
      '商品を選択してください';


    select.appendChild(
      firstOption
    );


    /* ---------------------------------------------
       商品を追加
    --------------------------------------------- */

    products.forEach(
      function(product, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          String(index);


        option.textContent =
          product.productName ||
          product.name ||
          '商品名なし';


        select.appendChild(
          option
        );

      }
    );


    showMessage(
      '商品を選択してください'
    );

  }
  catch (error) {

    console.error(
      error
    );


    showMessage(
      error.message ||
      '商品一覧を取得できませんでした。',
      true
    );

  }

}


/* =================================================
   商品選択
================================================= */

document
  .getElementById(
    'productSelect'
  )
  .addEventListener(
    'change',
    function() {

      const index =
        this.value;


      /* ---------------------------------------------
         商品未選択
      --------------------------------------------- */

      if (
        index === ''
      ) {

        selectedProduct =
          null;


        document
          .getElementById(
            'productInfo'
          )
          .style.display =
            'none';


        document
          .getElementById(
            'remainderArea'
          )
          .style.display =
            'none';


        document
          .getElementById(
            'remainderInput'
          )
          .value =
            0;


        return;

      }


      /* ---------------------------------------------
         商品取得
      --------------------------------------------- */

      selectedProduct =
        products[
          Number(index)
        ];


      if (
        !selectedProduct
      ) {

        return;

      }


      displaySelectedProduct();

    }
  );


/* =================================================
   選択した商品を表示
================================================= */

function displaySelectedProduct() {


  /* -----------------------------------------------
     JAN
  ----------------------------------------------- */

  document
    .getElementById(
      'jan'
    )
    .textContent =
      selectedProduct.jan ||
      '-';


  /* -----------------------------------------------
     現在の端数
  ----------------------------------------------- */

  document
    .getElementById(
      'currentRemainder'
    )
    .textContent =
      selectedProduct.remainder ??
      0;


  /*
   * 今回入力する値は必ず0から開始
   */

  document
    .getElementById(
      'remainderInput'
    )
    .value =
      0;


  /* -----------------------------------------------
     商品情報表示
  ----------------------------------------------- */

  document
    .getElementById(
      'productInfo'
    )
    .style.display =
      'block';


  /* -----------------------------------------------
     端数入力表示
  ----------------------------------------------- */

  document
    .getElementById(
      'remainderArea'
    )
    .style.display =
      'block';


  /* -----------------------------------------------
     入力欄へカーソル
  ----------------------------------------------- */

  document
    .getElementById(
      'remainderInput'
    )
    .focus();

}


/* =================================================
   端数確定
================================================= */

async function confirmRemainder() {


  /* -----------------------------------------------
     商品未選択
  ----------------------------------------------- */

  if (
    !selectedProduct
  ) {

    showMessage(
      '商品を選択してください。',
      true
    );

    return;

  }


  /* -----------------------------------------------
     保存中
  ----------------------------------------------- */

  if (
    processing
  ) {

    return;

  }


  const input =
    document.getElementById(
      'remainderInput'
    );


  const remainder =
    Number(
      input.value
    );


  /* -----------------------------------------------
     整数チェック
  ----------------------------------------------- */

  if (
    !Number.isInteger(
      remainder
    )
  ) {

    showMessage(
      '端数は整数で入力してください。',
      true
    );

    input.focus();

    return;

  }


  /* -----------------------------------------------
     0未満禁止
  ----------------------------------------------- */

  if (
    remainder < 0
  ) {

    showMessage(
      '端数は0以上で入力してください。',
      true
    );

    input.focus();

    return;

  }


  /* -----------------------------------------------
     0の場合
  ----------------------------------------------- */

  if (
    remainder === 0
  ) {

    showMessage(
      '1個以上入力してください。',
      true
    );

    input.focus();

    return;

  }


  const button =
    document.getElementById(
      'confirmButton'
    );


  /* -----------------------------------------------
     保存開始
  ----------------------------------------------- */

  processing =
    true;


  button.disabled =
    true;


  showMessage(
    '端数を保存しています…'
  );


  try {


    /* ---------------------------------------------
       GASへ送信
       
       GAS側で
       
       現在の端数
       ＋
       今回入力した端数
       
       として計算します。
       
       例：
       
       現在5個
       今回4個
       
       ↓
       
       9個
    --------------------------------------------- */

    const result =
      await sendToGAS(
        'setRemainder',
        selectedProduct.jan,
        {
          remainder:
            remainder
        }
      );


    console.log(
      '端数保存結果:',
      result
    );


    /* ---------------------------------------------
       エラー
    --------------------------------------------- */

    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        '端数を保存できませんでした。'
      );

    }


    /* ---------------------------------------------
       保存成功
    --------------------------------------------- */

    selectedProduct.remainder =
      result.remainder;


    /* ---------------------------------------------
       現在の端数を更新
    --------------------------------------------- */

    document
      .getElementById(
        'currentRemainder'
      )
      .textContent =
        result.remainder;


    /* ---------------------------------------------
       ★入力欄を0に戻す
    --------------------------------------------- */

    input.value =
      0;


    /* ---------------------------------------------
       保存完了
    --------------------------------------------- */

    showMessage(
      '✓ 端数を保存しました'
    );


    /* ---------------------------------------------
       次の入力のために
       入力欄へカーソル
    --------------------------------------------- */

    input.focus();


  }
  catch (error) {


    console.error(
      error
    );


    showMessage(
      error.message ||
      '端数の保存に失敗しました。',
      true
    );

  }
  finally {


    processing =
      false;


    button.disabled =
      false;

  }

}


/* =================================================
   ページ読み込み
================================================= */

window.addEventListener(
  'load',
  function() {

    /*
     * ページを開いた時も
     * 入力欄を必ず0にする
     */

    document
      .getElementById(
        'remainderInput'
      )
      .value =
        0;


    loadProducts();

  }
);

</script>

</body>
</html>
