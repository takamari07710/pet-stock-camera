<h1>

</h1>


<!-- =========================

<div class="mode">

<!-- =========================

========================= -->

<div id="message">

  カメラを準備しています…

</div>



<script>


/* =================================================
   GAS URL
================================================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPrA/exec';



/* =================================================
   変数
================================================= */

let scanner = null;

let mode = 'in';

let processing = false;

let lastCode = '';

let lastScanTime = 0;



/* =================================================
   入庫・使用
================================================= */

function setMode(newMode) {

  mode =
    newMode;


  document
    .getElementById('inButton')
    .classList
    .toggle(
      'active',
      mode === 'in'
    );


  document
    .getElementById('outButton')
    .classList
    .toggle(
      'active',
      mode === 'out'
    );


  showMessage(

    mode === 'in'
      ? '＋ 入庫モード'
      : '− 使用モード'

  );

}



/* =================================================
   メッセージ
================================================= */

function showMessage(
  text,
  error = false
) {

  const element =
    document.getElementById(
      'message'
    );


  element.textContent =
    text;


  element.className =
    error
      ? 'error'
      : '';

}



/* =================================================
   読み取り成功表示
================================================= */

function showSuccess(
  code
) {

  console.log(
    '読み取り成功：',
    code
  );


  const overlay =
    document.getElementById(
      'successOverlay'
    );


  const codeElement =
    document.getElementById(
      'successCode'
    );


  codeElement.textContent =
    code;


  /*
   * 表示
   */

  overlay.style.display =
    'flex';


  /*
   * 1秒後に非表示
   */

  setTimeout(
    function() {

      overlay.style.display =
        'none';

    },
    1000
  );

}



/* =================================================
   GAS通信
================================================= */

function sendToGAS(
  jan
) {

  return new Promise(
    function(resolve, reject) {


      /*
       * JSONP用callback名
       */

      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * scriptタグ作成
       */

      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      /*
       * GASから返ってきた結果
       */

      window[callbackName] =
        function(result) {


          if (finished) {
            return;
          }


          finished =
            true;


          console.log(
            'GASからの返答：',
            result
          );


          /*
           * callback削除
           */

          delete window[
            callbackName
          ];


          /*
           * script削除
           */

          script.remove();


          resolve(
            result
          );

        };


      /*
       * 通信エラー
       */

      script.onerror =
        function() {


          if (finished) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'GASとの通信に失敗しました。'
            )
          );

        };


      /*
       * GAS URL
       */

      script.src =
        GAS_URL +

        '?code=' +
        encodeURIComponent(
          jan
        ) +

        '&mode=' +
        encodeURIComponent(
          mode
        ) +

        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      console.log(
        'GASへ送信：',
        script.src
      );


      /*
       * scriptを実行
       */

      document
        .body
        .appendChild(
          script
        );


      /*
       * タイムアウト
       */

      setTimeout(
        function() {


          if (finished) {
            return;
          }


          finished =
            true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'GASからの返答がありません。'
            )
          );


        },
        10000
      );

    }
  );

}



/* =================================================
   商品情報表示
================================================= */

function displayResult(
  result
) {


  /*
   * 商品名
   */

  document
    .getElementById(
      'productName'
    )
    .textContent =
      result.name ||
      '';


  /*
   * パック数
   */

  document
    .getElementById(
      'packCount'
    )
    .textContent =
      result.packCount +
      ' パック';


  /*
   * 1パックあたり
   */

  document
    .getElementById(
      'perPack'
    )
    .textContent =
      result.perPack +
      ' 個';


  /*
   * 端数
   */

  document
    .getElementById(
      'remainder'
    )
    .textContent =
      result.remainder +
      ' 個';


  /*
   * 合計
   */

  document
    .getElementById(
      'total'
    )
    .textContent =
      result.total +
      ' 個';


  /*
   * 警告は今回は使用しない
   */

  document
    .getElementById(
      'warning'
    )
    .textContent =
      '';

}



/* =================================================
   JAN読み取り成功
================================================= */

async function onScanSuccess(
  decodedText
) {


  const now =
    Date.now();


  /*
   * 処理中なら無視
   */

  if (
    processing
  ) {

    return;

  }


  /*
   * 同じJANを連続読み取りしない
   */

  if (

    decodedText ===
    lastCode &&

    now - lastScanTime <
    2000

  ) {

    return;

  }


  /*
   * 状態保存
   */

  lastCode =
    decodedText;


  lastScanTime =
    now;


  processing =
    true;


  console.log(
    'JAN読み取り成功：',
    decodedText
  );


  /*
   * ==========================================
   * ① 読み取り成功表示
   * ==========================================
   */

  showSuccess(
    decodedText
  );


  /*
   * ==========================================
   * ② メッセージ
   * ==========================================
   */

  showMessage(
    '読み取り成功。処理しています…'
  );


  /*
   * ==========================================
   * ③ 1秒待つ
   * ==========================================
   */

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        1000
      );

    }
  );


  try {


    /*
     * ======================================
     * ④ GASへ送信
     * ======================================
     */

    const result =
      await sendToGAS(
        decodedText
      );


    /*
     * コンソール
     */

    console.log(
      'GAS結果：',
      result
    );


    /*
     * ======================================
     * ⑤ GASエラー
     * ======================================
     */

    if (
      !result.success
    ) {


      document
        .getElementById(
          'productName'
        )
        .textContent =
          result.message ||
          'エラー';


      document
        .getElementById(
          'packCount'
        )
        .textContent =
          '-';


      document
        .getElementById(
          'perPack'
        )
        .textContent =
          '-';


      document
        .getElementById(
          'remainder'
        )
        .textContent =
          '-';


      document
        .getElementById(
          'total'
        )
        .textContent =
          '-';


      showMessage(
        result.message ||
        '処理できませんでした。',
        true
      );


      return;

    }


    /*
     * ======================================
     * ⑥ 画面更新
     * ======================================
     */

    displayResult(
      result
    );


    /*
     * ======================================
     * ⑦ 完了メッセージ
     * ======================================
     */

    if (
      mode === 'in'
    ) {

      showMessage(
        '＋ 1パック追加しました'
      );

    }

    else {

      showMessage(
        '− 1個使用しました'
      );

    }

  }


  catch (error) {


    console.error(
      'GAS通信エラー：',
      error
    );


    showMessage(
      error.message,
      true
    );

  }


  finally {


    /*
     * 少し待ってから
     * 次の読み取りを許可
     */

    setTimeout(
      function() {

        processing =
          false;

      },
      500
    );

  }

}



/* =================================================
   カメラ起動
================================================= */

async function startScanner() {

  try {


    showMessage(
      'カメラを起動しています…'
    );


    /*
     * Html5Qrcode
     */

    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * カメラ一覧取得
     */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'カメラが見つかりません。'
      );

    }


    /*
     * 最初のカメラ
     */

    let cameraId =
      cameras[0].id;


    /*
     * 背面カメラを優先
     */

    for (
      const camera
      of cameras
    ) {


      const label =
        (
          camera.label ||
          ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('背面')

      ) {

        cameraId =
          camera.id;

        break;

      }

    }


    /*
     * ==========================================
     * カメラ起動
     * ==========================================
     */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        /*
         * バーコード枠
         */

        qrbox: {

          width: 300,

          height: 150

        },

        /*
         * JANコード
         */

        formatsToSupport: [

          Html5QrcodeSupportedFormats
            .EAN_13,

          Html5QrcodeSupportedFormats
            .EAN_8,

          Html5QrcodeSupportedFormats
            .UPC_A

        ]

      },


      /*
       * 成功
       */

      onScanSuccess,


      /*
       * 読み取り失敗
       *
       * 無視
       */

      function() {}

    );


    /*
     * カメラ起動完了
     */

    showMessage(
      '📷 バーコードを映してください'
    );

  }


  catch (error) {


    console.error(
      'カメラ起動エラー：',
      error
    );


    showMessage(

      'カメラを起動できません：' +
      error.message,

      true

    );

  }

}



/* =================================================
   ページ読み込み
================================================= */

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>


</body>
