<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1">

  <title>ペットシーツ在庫</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }


    /* 入庫・使用 */

    .mode {
      display: flex;
      gap: 10px;
      max-width: 500px;
      margin: 20px auto;
    }

    .mode button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ddd;
    }

    .mode button.active {
      background: #2196f3;
      color: white;
    }


    /* カメラ */

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #reader {
      width: 100%;
      margin: auto;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }


    /*
     * 読み取り成功表示
     *
     * カメラの上に完全に重ねる
     */

    #successOverlay {

      display: none;

      position: absolute;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 9999;

      background: rgba(0, 180, 0, 0.85);

      color: white;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      border-radius: 10px;

      pointer-events: none;
    }


    #successOverlay .icon {

      font-size: 80px;

      font-weight: bold;

      line-height: 1;

    }


    #successOverlay .title {

      font-size: 32px;

      font-weight: bold;

      margin-top: 15px;

    }


    #successOverlay .code {

      font-size: 18px;

      margin-top: 10px;

    }


    /* 商品情報 */

    .result {

      max-width: 500px;

      margin: 20px auto;

      padding: 15px;

      background: white;

      border-radius: 10px;
    }


    #productName {
      font-size: 20px;
    }


    #stock {

      font-size: 36px;

      font-weight: bold;

      margin: 10px;

    }


    #warning {

      color: #d32f2f;

      font-weight: bold;

    }


    /* メッセージ */

    #message {

      max-width: 500px;

      margin: 20px auto;

      padding: 15px;

      border-radius: 10px;

      background: #e8f5e9;

    }


    #message.error {

      background: #ffebee;

      color: #c62828;

    }

  </style>

</head>

<body>

<h1>🐾 ペットシーツ在庫</h1>

<!-- 入庫・使用 -->

<div class="mode">

<button
 id="inButton"
 class="active"
 onclick="setMode('in')">

```
＋ 入庫
```

  </button>

<button
 id="outButton"
 onclick="setMode('out')">

```
− 使用
```

  </button>

</div>

<!-- カメラ -->

<div id="cameraArea">

  <div id="reader"></div>

  <!-- 成功時にカメラへ重ねる -->

  <div id="successOverlay">

```
<div class="icon">
  ✓
</div>

<div class="title">
  読み取り成功
</div>

<div
  class="code"
  id="successCode">
</div>
```

  </div>

</div>

<!-- 商品情報 -->

<div class="result">

  <div id="productName">
    バーコードを読み取ってください
  </div>

  <div id="stock">
    -
  </div>

  <div id="warning"></div>

</div>

<!-- メッセージ -->

<div id="message">
  カメラを準備しています…
</div>

<script>


/* =================================================
   GAS URL
================================================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPrA/exec';


/* =================================================
   変数
================================================= */

let scanner = null;

let mode = 'in';

let processing = false;

let lastCode = '';

let lastScanTime = 0;


/* =================================================
   入庫・使用
================================================= */

function setMode(newMode) {

  mode = newMode;


  document
    .getElementById('inButton')
    .classList
    .toggle(
      'active',
      mode === 'in'
    );


  document
    .getElementById('outButton')
    .classList
    .toggle(
      'active',
      mode === 'out'
    );


  showMessage(
    mode === 'in'
      ? '＋ 入庫モード'
      : '− 使用モード'
  );

}


/* =================================================
   メッセージ
================================================= */

function showMessage(
  text,
  error = false
) {

  const message =
    document.getElementById(
      'message'
    );


  message.textContent =
    text;


  message.className =
    error
      ? 'error'
      : '';

}


/* =================================================
   ★ 読み取り成功表示
================================================= */

function showSuccessOverlay(
  code
) {

  console.log(
    '読み取り成功表示：',
    code
  );


  const overlay =
    document.getElementById(
      'successOverlay'
    );


  const codeElement =
    document.getElementById(
      'successCode'
    );


  codeElement.textContent =
    code;


  /*
   * display:none → flex
   */

  overlay.style.display =
    'flex';


  /*
   * 1秒後に消す
   */

  setTimeout(
    function() {

      overlay.style.display =
        'none';

    },
    1000
  );

}


/* =================================================
   GAS通信
================================================= */

function sendToGAS(
  jan
) {

  return new Promise(
    function(resolve, reject) {


      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      /*
       * GASからの返答
       */

      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }


          finished = true;


          console.log(
            'GAS返答：',
            result
          );


          delete window[
            callbackName
          ];


          script.remove();


          resolve(result);

        };


      /*
       * エラー
       */

      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'GASとの通信に失敗しました'
            )
          );

        };


      /*
       * GAS URL
       */

      script.src =
        GAS_URL +

        '?code=' +
        encodeURIComponent(
          jan
        ) +

        '&mode=' +
        encodeURIComponent(
          mode
        ) +

        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      console.log(
        'GAS送信：',
        script.src
      );


      document
        .body
        .appendChild(
          script
        );

    }
  );

}


/* =================================================
   JAN読み取り成功
================================================= */

async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * 処理中は無視
   */

  if (processing) {
    return;
  }


  /*
   * 同じJANの連続読み取り防止
   */

  if (

    decodedText === lastCode &&

    now - lastScanTime < 2000

  ) {

    return;

  }


  lastCode =
    decodedText;


  lastScanTime =
    now;


  processing =
    true;


  console.log(
    'JAN読み取り：',
    decodedText
  );


  /*
   * ==========================================
   * ① まず成功表示
   * ==========================================
   */

  showSuccessOverlay(
    decodedText
  );


  /*
   * ==========================================
   * ② 画面下のメッセージ
   * ==========================================
   */

  showMessage(
    '読み取り成功。処理しています…'
  );


  /*
   * ==========================================
   * ③ 1秒待つ
   * ==========================================
   *
   * これで「成功」が確実に1秒見える
   *
   */

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        1000
      );

    }
  );


  try {


    /*
     * ======================================
     * ④ GASへ送信
     * ======================================
     */

    const result =
      await sendToGAS(
        decodedText
      );


    console.log(
      'GAS結果：',
      result
    );


    /*
     * GAS側エラー
     */

    if (
      !result.success
    ) {


      document
        .getElementById(
          'productName'
        )
        .textContent =
          result.message ||
          'エラー';


      document
        .getElementById(
          'stock'
        )
        .textContent =
          result.stock !== undefined
            ? result.stock + ' パック'
            : '-';


      showMessage(
        result.message ||
        '処理できませんでした',
        true
      );


      return;

    }


    /*
     * 商品名
     */

    document
      .getElementById(
        'productName'
      )
      .textContent =
        result.name;


    /*
     * 在庫
     */

    document
      .getElementById(
        'stock'
      )
      .textContent =
        result.stock +
        ' パック';


    /*
     * 最低在庫
     */

    if (

      result.stock <=
      result.minStock

    ) {

      document
        .getElementById(
          'warning'
        )
        .textContent =
          '⚠ 在庫が少なくなっています';

    }

    else {

      document
        .getElementById(
          'warning'
        )
        .textContent =
          '';

    }


    /*
     * 完了メッセージ
     */

    if (
      mode === 'in'
    ) {

      showMessage(
        '＋ 1パック追加しました'
      );

    }

    else {

      showMessage(
        '− 1パック減らしました'
      );

    }

  }


  catch (error) {

    console.error(
      error
    );


    showMessage(
      error.message,
      true
    );

  }


  finally {

    /*
     * 次の読み取りを許可
     */

    setTimeout(
      function() {

        processing =
          false;

      },
      500
    );

  }

}


/* =================================================
   カメラ起動
================================================= */

async function startScanner() {

  try {


    showMessage(
      'カメラを起動しています…'
    );


    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * カメラ取得
     */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (

      !cameras ||

      cameras.length === 0

    ) {

      throw new Error(
        'カメラが見つかりません'
      );

    }


    /*
     * 最初のカメラ
     */

    let cameraId =
      cameras[0].id;


    /*
     * 背面カメラを優先
     */

    for (
      const camera
      of cameras
    ) {

      const label =
        (
          camera.label ||
          ''
        ).toLowerCase();


      if (

        label.includes('back') ||

        label.includes('rear') ||

        label.includes('environment') ||

        label.includes('背面')

      ) {

        cameraId =
          camera.id;

        break;

      }

    }


    /*
     * ======================================
     * カメラ起動
     * ======================================
     *
     * ★ここは変更しない
     */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 300,

          height: 150

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats
            .EAN_13,

          Html5QrcodeSupportedFormats
            .EAN_8,

          Html5QrcodeSupportedFormats
            .UPC_A

        ]

      },


      /*
       * 読み取り成功
       */

      onScanSuccess,


      /*
       * 読み取り失敗
       */

      function() {

        // 無視

      }

    );


    showMessage(
      '📷 バーコードを映してください'
    );

  }


  catch (error) {

    console.error(
      error
    );


    showMessage(

      'カメラを起動できません：' +
      error.message,

      true

    );

  }

}


/* =================================================
   ページ読み込み
================================================= */

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
