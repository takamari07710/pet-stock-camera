<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ペットシーツ在庫</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }
    /* =================================================
       タイトル
    ================================================= */
    h1 {
      font-size: 24px;
      margin: 10px 0 15px;
    }
    /* =================================================
       入庫・使用
    ================================================= */
    .mode {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }
    .mode button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      cursor: pointer;
    }
    .mode button.active {
      background: #2196f3;
      color: white;
    }
    /* =================================================
       カメラ
    ================================================= */
    #cameraArea {
      position: relative;
      width: 400px;
      height: 200px;
      max-width: 100%;
      margin: auto;
      box-sizing: border-box;
    }
    #reader {
      width: 100%;
      height: 200px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-sizing: border-box;
    }
    #reader video {
      width: 100% !important;
      height: 200px !important;
      object-fit: cover;
      display: block;
    }
    /* =================================================
       読み取り成功表示
    ================================================= */
    #successOverlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: rgba(0, 180, 0, 0.85);
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-radius: 10px;
      pointer-events: none;
    }
    #successOverlay .icon {
      font-size: 80px;
      font-weight: bold;
      line-height: 1;
    }
    #successOverlay .title {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }
    #successOverlay .code {
      font-size: 18px;
      margin-top: 10px;
    }
    /* =================================================
       商品情報
    ================================================= */
    .result {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 10px;
    }
    #productName {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    /* =================================================
       在庫表示
    ================================================= */
    .stockRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 18px;
      border-bottom: 1px solid #ddd;
    }
    .stockValue {
      font-size: 24px;
      font-weight: bold;
    }
    /* =================================================
       端数入力ページへのボタン
    ================================================= */
    #remainderPageButton {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #ff9800;
      color: white;
      cursor: pointer;
    }
    /* =================================================
       合計
    ================================================= */
    .totalArea {
      margin-top: 15px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 10px;
    }
    .totalLabel {
      font-size: 18px;
    }
    #total {
      font-size: 36px;
      font-weight: bold;
      margin-top: 5px;
    }
    /* =================================================
       警告
    ================================================= */
    #warning {
      margin-top: 10px;
      color: #d32f2f;
      font-weight: bold;
    }
    /* =================================================
       メッセージ
    ================================================= */
    #message {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: #e8f5e9;
    }
    #message.error {
      background: #ffebee;
      color: #c62828;
    }
    /* =================================================
       在庫一覧ボタン
    ================================================= */
    #stockListButton {
      width: 100%;
      max-width: 500px;
      margin: 20px auto 10px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #607d8b;
      color: white;
      cursor: pointer;
    }
    /* =================================================
       スマホ
    ================================================= */
    @media (max-width: 430px) {
      body {
        padding: 10px;
      }
      h1 {
        font-size: 22px;
      }
      .stockRow {
        font-size: 16px;
      }
      .stockValue {
        font-size: 22px;
      }
      #successOverlay .icon {
        font-size: 65px;
      }
      #successOverlay .title {
        font-size: 25px;
      }
      #cameraArea {
        width: 100%;
        max-width: 400px;
        height: 200px;
      }
      #reader {
        width: 100%;
        height: 200px;
      }
      #reader video {
        width: 100% !important;
        height: 200px !important;
      }
    }
  </style>
</head>
<body>
<h1>🐾 ペットシーツ在庫</h1>
<!-- =================================================
     入庫・使用
================================================= -->
<div class="mode">
  <button
    id="inButton"
    class="active"
    onclick="setMode('in')">
    ＋ 入庫
  </button>
  <button
    id="outButton"
    onclick="setMode('out')">
    − 使用
  </button>
</div>
<!-- =================================================
     カメラ
================================================= -->
<div id="cameraArea">
  <div id="reader"></div>
  <div id="successOverlay">
    <div class="icon">
      ✓
    </div>
    <div class="title">
      読み取り成功
    </div>
    <div
      class="code"
      id="successCode">
    </div>
  </div>
</div>
<!-- =================================================
     商品情報
================================================= -->
<div class="result">
  <div id="productName">
    バーコードを読み取ってください
  </div>
  <div class="stockRow">
    <span>
      パック数
    </span>
    <span
      class="stockValue"
      id="packCount">
      -
    </span>
    <span>
      パック
    </span>
  </div>
  
  <!-- =================================================
       合計
  ================================================= -->
  <div
    class="totalArea"
    id="totalArea"
    style="display:none;">
    <div class="totalLabel">
      合計
    </div>
    <div id="total">
      -
    </div>
    <div>
      個
    </div>
  </div>
  <!-- =================================================
       端数入力ページ
  ================================================= -->
  <button
    id="remainderPageButton"
    type="button"
    onclick="location.href='remainder.html'">
    ✏️ 端数を入力する
  </button>
  <div id="warning"></div>
</div>
<!-- =================================================
     メッセージ
================================================= -->
<div id="message">
  カメラを準備しています…
</div>
<!-- =================================================
     在庫一覧
================================================= -->
<button
  id="stockListButton"
  type="button"
  onclick="location.href='stock.html'">
  📦 在庫一覧を見る
</button>
<script>
/* =================================================
   GAS URL
================================================= */
const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPrA/exec';
/* =================================================
   変数
================================================= */
let scanner = null;
let mode = 'in';
let processing = false;
/*
 * 最後に読み取ったJAN
 */
let lastCode = '';
/*
 * 最後に読み取った時間
 */
let lastScanTime = 0;
/* =================================================
   入庫・使用モード
================================================= */
function setMode(newMode) {
  mode = newMode;
  document
    .getElementById('inButton')
    .classList
    .toggle(
      'active',
      mode === 'in'
    );
  document
    .getElementById('outButton')
    .classList
    .toggle(
      'active',
      mode === 'out'
    );
  showMessage(
    mode === 'in'
      ? '＋ 入庫モード'
      : '− 使用モード'
  );
}
/* =================================================
   メッセージ
================================================= */
function showMessage(
  text,
  error = false
) {
  const message =
    document.getElementById(
      'message'
    );
  message.textContent =
    text;
  message.className =
    error
      ? 'error'
      : '';
}
/* =================================================
   読み取り成功表示
================================================= */
function showSuccessOverlay(code) {
  const overlay =
    document.getElementById(
      'successOverlay'
    );
  const codeElement =
    document.getElementById(
      'successCode'
    );
  codeElement.textContent =
    code;
  overlay.style.display =
    'flex';
}
/* =================================================
   緑色表示を消す
================================================= */
function hideSuccessOverlay() {
  const overlay =
    document.getElementById(
      'successOverlay'
    );
  overlay.style.display =
    'none';
}
/* =================================================
   GAS通信
================================================= */
function sendToGAS(
  action,
  jan,
  extraParams = {}
) {
  return new Promise(
    function(resolve, reject) {
      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );
      const script =
        document.createElement(
          'script'
        );
      let finished = false;
      /*
       * GAS返答
       */
      window[callbackName] =
        function(result) {
          if (finished) {
            return;
          }
          finished = true;
          console.log(
            'GAS返答:',
            result
          );
          delete window[
            callbackName
          ];
          script.remove();
          resolve(result);
        };
      /*
       * 通信エラー
       */
      script.onerror =
        function() {
          if (finished) {
            return;
          }
          finished = true;
          delete window[
            callbackName
          ];
          script.remove();
          reject(
            new Error(
              'GASとの通信に失敗しました'
            )
          );
        };
      /*
       * URL
       */
      let url =
        GAS_URL +
        '?action=' +
        encodeURIComponent(
          action
        ) +
        '&code=' +
        encodeURIComponent(
          jan
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );
      /*
       * 追加パラメータ
       */
      for (
        const key in extraParams
      ) {
        url +=
          '&' +
          encodeURIComponent(key) +
          '=' +
          encodeURIComponent(
            extraParams[key]
          );
      }
      console.log(
        'GAS送信:',
        url
      );
      script.src =
        url;
      document
        .body
        .appendChild(
          script
        );
    }
  );
}
/* =================================================
   商品情報表示
================================================= */
function displayProduct(result) {
  document
    .getElementById(
      'productName'
    )
    .textContent =
      result.name ||
      result.productName ||
      '-';
  document
    .getElementById(
      'packCount'
    )
    .textContent =
      result.packCount;
  document
    .getElementById(
      'perPack'
    )
    .textContent =
      result.perPack;
  document
    .getElementById(
      'total'
    )
    .textContent =
      result.total;
  document
    .getElementById(
      'totalArea'
    )
    .style.display =
      'block';
}
/* =================================================
   JAN読み取り成功
================================================= */
async function onScanSuccess(
  decodedText
) {
  const now =
    Date.now();
  /* =================================================
     同じバーコードは2秒以内に読まない
  ================================================= */
  if (
    decodedText === lastCode &&
    now - lastScanTime < 2000
  ) {
    return;
  }
  /* =================================================
     通信処理中なら無視
  ================================================= */
  if (processing) {
    return;
  }
  /*
   * 最後に読み取ったJANと時間を保存
   */
  lastCode =
    decodedText;
  lastScanTime =
    now;
  /*
   * 通信中
   */
  processing =
    true;
  /*
   * 緑色表示
   */
  showSuccessOverlay(
    decodedText
  );
  /*
   * モード表示
   */
  showMessage(
    mode === 'in'
      ? '📦 入庫処理中…'
      : '📤 使用処理中…'
  );
  try {
    /* =================================================
       ここでパック数を自動変更
       
       in  → ＋1パック
       out → −1パック
    ================================================= */
    const result =
      await sendToGAS(
        'updateStock',
        decodedText,
        {
          mode: mode
        }
      );
    console.log(
      '在庫更新結果:',
      result
    );
    /* =================================================
       エラー
    ================================================= */
    if (
      !result.success
    ) {
      hideSuccessOverlay();
      document
        .getElementById(
          'warning'
        )
        .textContent =
          result.message ||
          '在庫の更新に失敗しました';
      showMessage(
        result.message ||
        '在庫の更新に失敗しました。',
        true
      );
      return;
    }
    /*
     * 警告を消す
     */
    document
      .getElementById(
        'warning'
      )
      .textContent =
        '';
    /* =================================================
       更新後の商品情報を表示
    ================================================= */
    displayProduct(
      result
    );
    /*
     * メッセージ
     */
    if (mode === 'in') {
      showMessage(
        '＋ パック数を1増やしました。2秒後に次を読み取れます'
      );
    }
    else {
      showMessage(
        '− パック数を1減らしました。2秒後に次を読み取れます'
      );
    }
    /* =================================================
       緑色表示を2秒後に消す
    ================================================= */
    setTimeout(
      function() {
        hideSuccessOverlay();
      },
      2000
    );
  }
  catch (error) {
    console.error(
      error
    );
    hideSuccessOverlay();
    showMessage(
      error.message ||
      '通信エラーが発生しました。',
      true
    );
  }
  finally {
    /*
     * 通信処理終了
     */
    processing =
      false;
  }
}
/* =================================================
   カメラ起動
================================================= */
async function startScanner() {
  try {
    showMessage(
      'カメラを起動しています…'
    );
    scanner =
      new Html5Qrcode(
        'reader'
      );
    /*
     * カメラ一覧
     */
    const cameras =
      await Html5Qrcode
        .getCameras();
    if (
      !cameras ||
      cameras.length === 0
    ) {
      throw new Error(
        'カメラが見つかりません'
      );
    }
    /*
     * 最初のカメラ
     */
    let cameraId =
      cameras[0].id;
    /*
     * 背面カメラ優先
     */
    for (
      const camera
      of cameras
    ) {
      const label =
        (
          camera.label ||
          ''
        ).toLowerCase();
      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('背面')
      ) {
        cameraId =
          camera.id;
        break;
      }
    }
    /* =================================================
       カメラ開始
       
       カメラ表示
       400 × 200
       
       バーコード読み取り範囲
       300 × 100
       
       スマホでは自動縮小
    ================================================= */
    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {
            const width =
              Math.min(
                300,
                Math.max(
                  200,
                  viewfinderWidth - 100
                )
              );
            const height =
              Math.min(
                100,
                Math.max(
                  80,
                  viewfinderHeight - 100
                )
              );
            return {
              width:
                width,
              height:
                height
            };
          },
        formatsToSupport: [
          Html5QrcodeSupportedFormats
            .EAN_13,
          Html5QrcodeSupportedFormats
            .EAN_8,
          Html5QrcodeSupportedFormats
            .UPC_A
        ]
      },
      /*
       * 読み取り成功
       */
      onScanSuccess,
      /*
       * 読み取り失敗
       */
      function() {
        // 無視
      }
    );
    showMessage(
      '📷 バーコードを映してください'
    );
  }
  catch (error) {
    console.error(
      error
    );
    showMessage(
      'カメラを起動できません：' +
      error.message,
      true
    );
  }
}
/* =================================================
   ページ読み込み
================================================= */
window.addEventListener(
  'load',
  function() {
    startScanner();
  }
);
</script>
</body>
</html>
