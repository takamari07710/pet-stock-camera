<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ペットシーツ在庫</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    /* =================================================
       タイトル
    ================================================= */
    h1 {
      font-size: 24px;
      margin: 10px 0 15px;
    }

    /* =================================================
       入庫・使用
    ================================================= */
    .mode {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
    }

    .mode button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      cursor: pointer;
    }

    .mode button.active {
      background: #2196f3;
      color: white;
    }

    /* =================================================
       カメラ
    ================================================= */
    #cameraArea {
      position: relative;
      width: 400px;
      height: 200px;
      max-width: 100%;
      margin: auto;
      box-sizing: border-box;
    }

    #reader {
      width: 100%;
      height: 200px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-sizing: border-box;
    }

    #reader video {
      width: 100% !important;
      height: 200px !important;
      object-fit: cover;
      display: block;
    }

    /* =================================================
       読み取り成功表示
    ================================================= */
    #successOverlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: rgba(0, 180, 0, 0.85);
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border-radius: 10px;
      pointer-events: none;
    }

    #successOverlay .icon {
      font-size: 80px;
      font-weight: bold;
      line-height: 1;
    }

    #successOverlay .title {
      font-size: 30px;
      font-weight: bold;
      margin-top: 10px;
    }

    #successOverlay .code {
      font-size: 18px;
      margin-top: 10px;
    }

    /* =================================================
       商品情報
    ================================================= */
    .result {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: 15px auto;
      padding: 18px;
      background: white;
      border-radius: 10px;
    }

    #productName {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* =================================================
       メッセージ
    ================================================= */
    #message {
      width: 100%;
      box-sizing: border-box;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      background: #e8f5e9;
    }

    #message.error {
      background: #ffebee;
      color: #c62828;
    }

    /* =================================================
       端数入力ページ
    ================================================= */
    #remainderPageButton {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #ff9800;
      color: white;
      cursor: pointer;
    }

    /* =================================================
       警告
    ================================================= */
    #warning {
      margin-top: 10px;
      color: #d32f2f;
      font-weight: bold;
    }

    /* =================================================
       在庫一覧
    ================================================= */
    #stockListButton {
      width: 100%;
      max-width: 500px;
      margin: 20px auto 10px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #607d8b;
      color: white;
      cursor: pointer;
    }

    /* =================================================
       スマホ調整
    ================================================= */
    @media (max-width: 430px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      #successOverlay .icon {
        font-size: 65px;
      }

      #successOverlay .title {
        font-size: 25px;
      }

      #cameraArea {
        width: 100%;
        max-width: 400px;
        height: 200px;
      }

      #reader {
        width: 100%;
        height: 200px;
      }

      #reader video {
        width: 100% !important;
        height: 200px !important;
      }
    }
  </style>
</head>

<body>

<h1>🐾 ペットシーツ在庫</h1>

<!-- 入庫・使用選択 -->
<div class="mode">
  <button id="inButton" class="active" onclick="setMode('in')">
    ＋ 入庫
  </button>
  <button id="outButton" onclick="setMode('out')">
    − 使用
  </button>
</div>

<!-- カメラエリア -->
<div id="cameraArea">
  <div id="reader"></div>
  <div id="successOverlay">
    <div class="icon">✓</div>
    <div class="title">読み取り成功</div>
    <div class="code" id="successCode"></div>
  </div>
</div>

<!-- 結果表示エリア -->
<div class="result">
  <div id="productName">バーコードを読み取ってください</div>
  <div id="message">カメラを準備しています…</div>

  <button id="remainderPageButton" type="button" onclick="location.href='remainder.html'">
    ✏️ 端数を入力する
  </button>

  <div id="warning"></div>
</div>

<!-- 在庫一覧ボタン -->
<button id="stockListButton" type="button" onclick="location.href='stock.html'">
  📦 在庫一覧を見る
</button>


<script>
/* =================================================
   GAS URL
================================================= */
const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPr4A/exec';

/* =================================================
   状態管理変数
================================================= */
let scanner = null;
let mode = 'in'; // 'in' または 'out'
let processing = false; // 二重読み取り防止フラグ
let lastCode = '';
let lastScanTime = 0;

/* =================================================
   モード切り替え
================================================= */
function setMode(newMode) {
  mode = newMode;

  document.getElementById('inButton').classList.toggle('active', mode === 'in');
  document.getElementById('outButton').classList.toggle('active', mode === 'out');

  showMessage(mode === 'in' ? '＋ 入庫モードに切り替えました' : '− 使用モードに切り替えました');
}

/* =================================================
   メッセージ表示
================================================= */
function showMessage(text, isError = false) {
  const msgEl = document.getElementById('message');
  msgEl.textContent = text;
  msgEl.className = isError ? 'error' : '';
}

/* =================================================
   オーバーレイ表示制御
================================================= */
function showSuccessOverlay(code) {
  document.getElementById('successCode').textContent = code;
  document.getElementById('successOverlay').style.display = 'flex';
}

function hideSuccessOverlay() {
  document.getElementById('successOverlay').style.display = 'none';
}

/* =================================================
   GAS通信 (JSONP)
================================================= */
function sendToGAS(action, jan) {
  return new Promise((resolve, reject) => {
    const callbackName = 'gasCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    let finished = false;

    window[callbackName] = function(result) {
      if (finished) return;
      finished = true;
      delete window[callbackName];
      script.remove();
      resolve(result);
    };

    script.onerror = function() {
      if (finished) return;
      finished = true;
      delete window[callbackName];
      script.remove();
      reject(new Error('GASとの通信に失敗しました'));
    };

    let url = GAS_URL +
      '?action=' + encodeURIComponent(action) +
      '&code=' + encodeURIComponent(jan) +
      '&mode=' + encodeURIComponent(mode) +
      '&callback=' + encodeURIComponent(callbackName);

    script.src = url;
    document.body.appendChild(script);
  });
}

/* =================================================
   バーコード読み取り時処理
================================================= */
async function onScanSuccess(decodedText) {
  const now = Date.now();
  const cleanCode = String(decodedText).trim();

  // 通信中、または同じバーコードを2秒以内に連続読み取りした場合は無視
  if (processing || (cleanCode === lastCode && (now - lastScanTime) < 2000)) {
    return;
  }

  processing = true;
  showSuccessOverlay(cleanCode);
  showMessage(mode === 'in' ? 'スプレッドシートに入庫を書き込んでいます…' : 'スプレッドシートに使用を書き込んでいます…');

  try {
    const res = await sendToGAS('updateStock', cleanCode);

    if (res.success) {
      document.getElementById('productName').textContent = res.name || '商品名不明';
      showMessage(`【${mode === 'in' ? '入庫完了' : '使用完了'}】現在のパック数: ${res.packCount} (合計: ${res.total})`);
      lastCode = cleanCode;
      lastScanTime = Date.now();
    } else {
      document.getElementById('productName').textContent = res.name || '読み取りエラー';
      showMessage(res.message || '処理に失敗しました', true);
    }
  } catch (err) {
    showMessage(err.message || '通信エラーが発生しました', true);
  } finally {
    setTimeout(() => {
      hideSuccessOverlay();
      processing = false;
    }, 1200);
  }
}

/* =================================================
   カメラの初期化と起動
================================================= */
function startCamera() {
  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: { width: 250, height: 150 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8
    ]
  };

  scanner.start(
    { facingMode: "environment" },
    config,
    onScanSuccess
  ).then(() => {
    showMessage('カメラ準備完了。バーコードを枠内にかざしてください。');
  }).catch((err) => {
    showMessage('カメラの起動に失敗しました。アクセス権限を確認してください。', true);
    console.error(err);
  });
}

// ページ読み込み時にカメラ起動
window.addEventListener('DOMContentLoaded', startCamera);

</script>
</body>
</html>
