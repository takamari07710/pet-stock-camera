<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>ペットシーツ在庫</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 24px;
    }

    .mode {
      display: flex;
      gap: 10px;
      max-width: 500px;
      margin: 20px auto;
    }

    .mode button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ddd;
    }

    .mode button.active {
      background: #2196f3;
      color: white;
    }

#reader {
  position: relative;
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
  border-radius: 10px;
  overflow: hidden;
}


    .result {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }

    #productName {
      font-size: 20px;
    }

    #stock {
      font-size: 36px;
      font-weight: bold;
      margin: 10px;
    }

    #warning {
      color: #d32f2f;
      font-weight: bold;
      margin-top: 10px;
    }

    #message {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      border-radius: 10px;
      background: #e8f5e9;
    }

    .error {
      background: #ffebee !important;
      color: #c62828;
    }

  </style>
</head>


<body>

<h1>🐾 ペットシーツ在庫</h1>


<!-- =========================
     入庫 / 使用
========================= -->

<div class="mode">

  <button
    id="inButton"
    class="active"
    onclick="setMode('in')">

    ＋ 入庫

  </button>

  <button
    id="outButton"
    onclick="setMode('out')">

    − 使用

  </button>

</div>


<!-- =========================
     カメラ
========================= -->

<div id="reader"></div>


<!-- =========================
     商品情報
========================= -->

<div class="result">

  <div id="productName">
    バーコードを読み取ってください
  </div>

  <div id="stock">
    -
  </div>

  <div id="warning"></div>

</div>


<!-- =========================
     メッセージ
========================= -->

<div id="message">
  カメラを準備しています…
</div>


<script>


/* ==================================================
   GAS WebアプリURL
================================================== */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPrA/exec';


/* ==================================================
   変数
================================================== */

let scanner = null;

let mode = 'in';

let processing = false;

let lastCode = '';

let lastScanTime = 0;


/* ==================================================
   入庫 / 使用切り替え
================================================== */

function setMode(newMode) {

  mode = newMode;


  document
    .getElementById('inButton')
    .classList
    .toggle(
      'active',
      mode === 'in'
    );


  document
    .getElementById('outButton')
    .classList
    .toggle(
      'active',
      mode === 'out'
    );


  showMessage(

    mode === 'in'
      ? '＋ 入庫モード'
      : '− 使用モード'

  );

}


/* ==================================================
   メッセージ表示
================================================== */

function showMessage(
  text,
  error = false
) {

  const element =
    document.getElementById(
      'message'
    );


  element.textContent =
    text;


  element.className =
    error
      ? 'error'
      : '';

}


/* ==================================================
   GAS通信
================================================== */

function sendToGAS(jan) {

  return new Promise(
    function(resolve, reject) {

      /*
       * JSONP用の関数名
       */
      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * scriptタグ
       */
      const script =
        document.createElement(
          'script'
        );


      /*
       * GASから返ってくる関数
       */
      window[callbackName] =
        function(result) {

          console.log(
            'GASから受信：',
            result
          );


          delete window[
            callbackName
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          resolve(result);

        };


      /*
       * GAS URL
       */
      const url =
        GAS_URL +
        '?code=' +
        encodeURIComponent(
          jan
        ) +
        '&mode=' +
        encodeURIComponent(
          mode
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      console.log(
        'GASへ送信：',
        url
      );


      /*
       * エラー
       */
      script.onerror =
        function() {

          console.error(
            'GAS通信エラー'
          );


          delete window[
            callbackName
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(script);

          }


          reject(
            new Error(
              'GASとの通信に失敗しました'
            )
          );

        };


      /*
       * GASを呼び出す
       */
      script.src =
        url;


      document
        .body
        .appendChild(
          script
        );

    }
  );

}


/* ==================================================
   JAN読み取り成功
================================================== */

async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * 処理中なら無視
   */
  if (
    processing
  ) {

    return;

  }


  /*
   * 同じJANの連続読み取り防止
   */
  if (
    decodedText === lastCode &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastCode =
    decodedText;


  lastScanTime =
    now;


  processing =
    true;


  /*
   * JAN読み取り確認
   */
  showMessage(
    '読み取り成功：' +
    decodedText
  );


  try {

    /*
     * GAS送信
     */
    showMessage(
      'GASへ送信しています…'
    );


    const result =
      await sendToGAS(
        decodedText
      );


    console.log(
      'GAS結果：',
      result
    );


    /*
     * GAS側エラー
     */
    if (
      !result.success
    ) {

      document
        .getElementById(
          'productName'
        )
        .textContent =
          result.message ||
          'エラー';


      if (
        result.stock !== undefined
      ) {

        document
          .getElementById(
            'stock'
          )
          .textContent =
            result.stock +
            ' パック';

      }

      else {

        document
          .getElementById(
            'stock'
          )
          .textContent =
            '-';

      }


      showMessage(
        result.message ||
        '処理できませんでした',
        true
      );


      return;

    }


    /*
     * 商品名
     */
    document
      .getElementById(
        'productName'
      )
      .textContent =
        result.name;


    /*
     * 在庫
     */
    document
      .getElementById(
        'stock'
      )
      .textContent =
        result.stock +
        ' パック';


    /*
     * 最低在庫警告
     */
    if (
      result.stock <=
      result.minStock
    ) {

      document
        .getElementById(
          'warning'
        )
        .textContent =
          '⚠ 在庫が少なくなっています';

    }

    else {

      document
        .getElementById(
          'warning'
        )
        .textContent =
          '';

    }


    /*
     * 成功メッセージ
     */
    if (
      mode === 'in'
    ) {

      showMessage(
        '＋ 1パック追加しました'
      );

    }

    else {

      showMessage(
        '− 1パック減らしました'
      );

    }

  }


  catch (error) {

    console.error(
      error
    );


    showMessage(
      'エラー：' +
      error.message,
      true
    );

  }


  finally {

    /*
     * 1秒後に次の読み取りを許可
     */
    setTimeout(
      function() {

        processing =
          false;

      },
      1000
    );

  }

}


/* ==================================================
   カメラ起動
================================================== */

async function startScanner() {

  try {

    showMessage(
      'カメラを起動しています…'
    );


    /*
     * スキャナー作成
     */
    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * カメラ一覧取得
     */
    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'カメラが見つかりません'
      );

    }


    /*
     * 最初のカメラ
     */
    let cameraId =
      cameras[0].id;


    /*
     * 背面カメラを優先
     */
    for (
      const camera
      of cameras
    ) {

      const label =
        (
          camera.label ||
          ''
        ).toLowerCase();


      if (

        label.includes(
          'back'
        ) ||

        label.includes(
          'rear'
        ) ||

        label.includes(
          'environment'
        ) ||

        label.includes(
          '背面'
        )

      ) {

        cameraId =
          camera.id;

        break;

      }

    }


    /*
     * カメラ開始
     */
    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 300,

          height: 150

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats
            .EAN_13,

          Html5QrcodeSupportedFormats
            .EAN_8,

          Html5QrcodeSupportedFormats
            .UPC_A

        ]

      },


      /*
       * JAN読み取り成功
       */
      onScanSuccess,


      /*
       * 読み取り失敗
       */
      function() {

        // 無視

      }

    );


    showMessage(
      '📷 バーコードを映してください'
    );

  }


  catch (error) {

    console.error(
      error
    );


    showMessage(
      'カメラを起動できません：' +
      error.message,
      true
    );

  }

}


/* ==================================================
   ページ読み込み
================================================== */

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
