<h1>🐾 ペットシーツ在庫</h1>


<!-- =========================
     入庫・使用
========================= -->

<div class="mode">

  <button
    id="inButton"
    class="active"
    onclick="setMode('in')"
  >
    ＋ 入庫
  </button>

  <button
    id="outButton"
    onclick="setMode('out')"
  >
    − 使用
  </button>

</div>

<div id="cameraArea">

  <!-- 読み取り成功表示 -->

  <div id="successOverlay">

    <div id="successIcon">
      ✓
    </div>

    <div id="successTitle">
      読み取り成功
    </div>

    <div id="successCode"></div>

  </div>

</div>


<!-- =========================
     商品情報
========================= -->

<div class="result">

  <div id="productName">
    バーコードを読み取ってください
  </div>


  <div class="stockInfo">


    <!-- パック数 -->

    <div class="stockBox">

      <div class="stockLabel">
        パック数
      </div>

        class="stockValue"
        id="packCount"
      >
        -
      </div>

    </div>


    <!-- 1パックあたり -->

    <div class="stockBox">

      <div class="stockLabel">
        1パックあたり
      </div>

      <div
        class="stockValue"
        id="perPack"
      >
        -
      </div>

    </div>


    <!-- 端数 -->

    <div class="stockBox">

      <div class="stockLabel">
        端数
      </div>

      <div
        class="stockValue"
        id="remainder"
      >
        -
      </div>

    </div>


    <!-- 合計 -->

    <div class="stockBox totalBox">

      <div class="stockLabel">
        合計
      </div>

      <div
        class="stockValue"
        id="total"
      >
        -
      </div>

    </div>

  </div>


  <div id="warning"></div>

</div>


<!-- =========================
     メッセージ
========================= -->

<div id="message">
  カメラを準備しています…
</div>



<script>


/* =================================================
   GAS URL
================================================= */

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwQakZgWFftn4VYnP9BdfoKLLfGu1pjPEPwxY6WSpoLn4aeIIwypYcph-UAs2pLpdxPrA/exec';



/* =================================================
   変数
================================================= */

let scanner = null;

let mode = 'in';

let processing = false;

let lastCode = '';

let lastScanTime = 0;



/* =================================================
   入庫 / 使用
================================================= */

function setMode(newMode) {

  mode = newMode;

  document
    .getElementById('inButton')
    .classList
    .toggle(
      'active',
      mode === 'in'
    );

  document
    .getElementById('outButton')
    .classList
    .toggle(
      'active',
      mode === 'out'
    );

  showMessage(
    mode === 'in'
      ? '＋ 入庫モード'
      : '− 使用モード'
  );

}



/* =================================================
   メッセージ
================================================= */

function showMessage(
  text,
  error = false
) {

  const element =
    document.getElementById('message');

  element.textContent =
    text;

  element.className =
    error
      ? 'error'
      : '';

}



/* =================================================
   読み取り成功表示
================================================= */

function showSuccess(code) {

  const overlay =
    document.getElementById(
      'successOverlay'
    );

  const codeElement =
    document.getElementById(
      'successCode'
    );

  codeElement.textContent =
    code;

  overlay.style.display =
    'flex';

  setTimeout(
    function() {

      overlay.style.display =
        'none';

    },
    1000
  );

}



/* =================================================
   GAS通信
================================================= */

function sendToGAS(jan) {

  return new Promise(
    function(resolve, reject) {

      /*
       * 毎回違うcallback名
       */

      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      /*
       * scriptタグ
       */

      const script =
        document.createElement(
          'script'
        );


      let finished = false;


      /*
       * GASからの返答
       */

      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }

          finished = true;

          console.log(
            'GAS返答:',
            result
          );

          delete window[
            callbackName
          ];

          script.remove();

          resolve(result);

        };


      /*
       * 通信エラー
       */

      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              'GASとの通信に失敗しました。'
            )
          );

        };


      /*
       * GAS URL
       */

      script.src =
        GAS_URL +

        '?code=' +
        encodeURIComponent(
          jan
        ) +

        '&mode=' +
        encodeURIComponent(
          mode
        ) +

        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      console.log(
        'GAS送信:',
        script.src
      );


      /*
       * 実行
       */

      document.body.appendChild(
        script
      );


      /*
       * 10秒タイムアウト
       */

      setTimeout(
        function() {

          if (finished) {
            return;
          }

          finished = true;

          delete window[
            callbackName
          ];

          script.remove();

          reject(
            new Error(
              'GASからの返答がありません。'
            )
          );

        },
        10000
      );

    }
  );

}



/* =================================================
   商品情報を表示
================================================= */

function displayResult(result) {

  /*
   * 商品名
   */

  document
    .getElementById(
      'productName'
    )
    .textContent =
      result.name || '-';


  /*
   * パック数
   *
   * GAS：
   * result.packCount
   */

  document
    .getElementById(
      'packCount'
    )
    .textContent =
      Number(
        result.packCount
      ) +
      ' パック';


  /*
   * 1パックあたり
   */

  document
    .getElementById(
      'perPack'
    )
    .textContent =
      Number(
        result.perPack
      ) +
      ' 個';


  /*
   * 端数
   */

  document
    .getElementById(
      'remainder'
    )
    .textContent =
      Number(
        result.remainder
      ) +
      ' 個';


  /*
   * 合計
   */

  document
    .getElementById(
      'total'
    )
    .textContent =
      Number(
        result.total
      ) +
      ' 個';

}



/* =================================================
   エラー表示
================================================= */

function clearResult() {

  document
    .getElementById(
      'productName'
    )
    .textContent =
      '-';

  document
    .getElementById(
      'packCount'
    )
    .textContent =
      '-';

  document
    .getElementById(
      'perPack'
    )
    .textContent =
      '-';

  document
    .getElementById(
      'remainder'
    )
    .textContent =
      '-';

  document
    .getElementById(
      'total'
    )
    .textContent =
      '-';

}



/* =================================================
   JAN読み取り成功
================================================= */

async function onScanSuccess(
  decodedText
) {

  const now =
    Date.now();


  /*
   * 処理中なら無視
   */

  if (processing) {
    return;
  }


  /*
   * 同じJANを短時間で
   * 何度も処理しない
   */

  if (
    decodedText === lastCode &&
    now - lastScanTime < 2000
  ) {

    return;

  }


  lastCode =
    decodedText;

  lastScanTime =
    now;

  processing =
    true;


  console.log(
    'JAN読み取り:',
    decodedText
  );


  /*
   * 読み取り成功
   */

  showSuccess(
    decodedText
  );


  showMessage(
    'GASへ送信しています…'
  );


  try {


    /*
     * GASへ送信
     */

    const result =
      await sendToGAS(
        decodedText
      );


    console.log(
      'GAS結果:',
      result
    );


    /*
     * エラー
     */

    if (!result.success) {

      clearResult();

      showMessage(
        result.message ||
        '処理に失敗しました。',
        true
      );

      return;

    }


    /*
     * 商品情報表示
     */

    displayResult(
      result
    );


    /*
     * 完了メッセージ
     */

    if (mode === 'in') {

      showMessage(
        '＋ 1パック追加しました'
      );

    } else {

      showMessage(
        '− 1個使用しました'
      );

    }

  }


  catch (error) {

    console.error(
      'GAS通信エラー:',
      error
    );

    showMessage(
      error.message,
      true
    );

  }


  finally {

    /*
     * 少し待ってから
     * 次の読み取りを許可
     */

    setTimeout(
      function() {

        processing =
          false;

      },
      500
    );

  }

}



/* =================================================
   カメラ起動
================================================= */

async function startScanner() {

  try {

    showMessage(
      'カメラを起動しています…'
    );


    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * カメラ一覧
     */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'カメラが見つかりません。'
      );

    }


    /*
     * 最初のカメラ
     */

    let cameraId =
      cameras[0].id;


    /*
     * 背面カメラ優先
     */

    for (
      const camera
      of cameras
    ) {

      const label =
        (
          camera.label ||
          ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('背面')
      ) {

        cameraId =
          camera.id;

        break;

      }

    }


    /*
     * カメラ起動
     */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        /*
         * バーコード枠
         */

        qrbox: {
          width: 300,
          height: 150
        },

        /*
         * JAN対応
         */

        formatsToSupport: [

          Html5QrcodeSupportedFormats
            .EAN_13,

          Html5QrcodeSupportedFormats
            .EAN_8,

          Html5QrcodeSupportedFormats
            .UPC_A

        ]

      },


      /*
       * 読み取り成功
       */

      onScanSuccess,


      /*
       * 読み取り失敗は無視
       */

      function() {}

    );


    showMessage(
      '📷 バーコードを映してください'
    );

  }


  catch (error) {

    console.error(
      'カメラエラー:',
      error
    );

    showMessage(
      'カメラを起動できません：' +
      error.message,
      true
    );

  }

}



/* =================================================
   ページ読み込み
================================================= */

window.addEventListener(
  'load',
  function() {

    startScanner();

  }
);

</script>


</body>

</html>
